[package]
name = "openpos-lite"
version = "0.1.0"
description = "OpenPOS Lite - aplikasi kasir offline untuk Windows"
authors = ["OpenPOS"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openpos_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
