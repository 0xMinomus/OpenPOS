name: Lite Linux Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/lite-linux.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/lite-linux.yml'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            rpm

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build Linux bundles
        run: npx tauri build --target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage
        working-directory: web

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: openpos-lite-linux
          path: |
            web/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            web/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            web/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error
